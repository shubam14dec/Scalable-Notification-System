# Production stack — one box, one compose file.
#
# ZERO published ports by design: no service declares `ports:`. The box's only
# public listener is sshd; all ingress arrives through the outbound-only
# Cloudflare tunnel (the cloudflared service below), which dials the edge and
# reaches `web` over the compose network. Nothing here is reachable from the
# internet except through that tunnel.

# CONTAINER HARDENING, and why it is not applied uniformly (S1.5).
#
# Every container we control the entrypoint of — api, worker, ws, acme-tools
# (our image, running as the `node` user), web (caddy) and cloudflared (its
# official nonroot image) — gets:
#   security_opt: ["no-new-privileges:true"]  # setuid binaries can't escalate
#   cap_drop: [ALL]                           # no Linux capabilities at all
# None of them bind a port under 1024, chown files, or otherwise need a
# capability, so ALL is genuinely droppable rather than a list to tune.
#
# postgres, redis and clickhouse are deliberately LEFT ALONE this round. Their
# official entrypoints start as root and drop to their own unprivileged user
# themselves (postgres via su-exec/gosu, clickhouse via its init scripts) —
# which needs CAP_SETUID/CAP_SETGID/CAP_CHOWN to do. Dropping ALL there breaks
# the very privilege-drop we want, and the fix is a different change
# (`user:` overrides + pre-chowned volumes) with a real chance of eating a data
# directory. Minimal blast radius: harden the app tier now, revisit the data
# tier as its own slice.

x-hardening: &hardening
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL

# api / worker / ws / acme-tools are the SAME image, differing only by command.
x-app: &app
  <<: *hardening
  build: .
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis is a durability store here, not just a cache — it holds
    # config:public-url (the live public URL, survives restarts by design), the
    # exec-log buffer and every BullMQ queue. AOF is not optional.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --dir /data
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - chdata-prod:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 3g
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- localhost:8123/ping || exit 1']
      interval: 10s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: npx tsx src/api/server.ts
    # ONE shared env file across api, worker and ws is what guarantees
    # JWT_SECRET is byte-identical between the api that mints dashboard tokens
    # and the ws gateway that verifies them.
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      retries: 10

  worker:
    <<: *app
    command: npx tsx src/workers/index.ts
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/health || exit 1']
      interval: 10s
      retries: 10

  ws:
    <<: *app
    command: npx tsx src/ws/gateway.ts
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      retries: 10

  # Demo-grade stub for the agent's refund tool: unsigned, holds no data. It is
  # public at tools.asyncify.org because the SSRF validation the product applies
  # to tenant-supplied tool URLs (src/core/safe-url.ts) rejects private targets —
  # an agent tool URL has to resolve publicly.
  acme-tools:
    <<: *app
    command: node scripts/acme-tools/serve.mjs

  web:
    <<: *hardening
    # The ONE capability added back, and not because Caddy uses it: the
    # official image ships /usr/bin/caddy with the file capability
    # `cap_net_bind_service=ep`, and execve of a binary whose EFFECTIVE file-cap
    # bit is set fails with EPERM when that capability is missing from the
    # container's bounding set. With a bare `cap_drop: [ALL]` the container dies
    # instantly with `exec /usr/bin/caddy: operation not permitted` — verified
    # locally. Caddy here binds :8080 with `auto_https off`, so it never
    # exercises the capability; this only makes the exec legal. The cleaner fix
    # is `setcap -r /usr/bin/caddy` in deploy/compose/dashboard.Dockerfile's
    # runtime stage, which would let this line go away.
    cap_add:
      - NET_BIND_SERVICE
    build:
      context: .
      dockerfile: deploy/compose/dashboard.Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml --credentials-file /etc/cloudflared/creds.json --no-autoupdate run ${TUNNEL_ID}
    volumes:
      - ./deploy/compose/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/compose/cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    restart: unless-stopped

volumes:
  pgdata-prod:
  redisdata:
  chdata-prod:
